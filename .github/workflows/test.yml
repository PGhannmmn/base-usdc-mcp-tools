name: Synthetic QA fixture tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run expected synthetic classifications
        run: python src/check_cases.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
