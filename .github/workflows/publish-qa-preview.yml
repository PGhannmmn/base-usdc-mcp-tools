name: Publish QA fixture preview release
on:
  push:
    branches:
      - preview/base-usdc-payment-qa-v0.1
    paths:
      - .github/workflows/publish-qa-preview.yml
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.repository == 'PGhannmmn/base-usdc-mcp-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 35 offline synthetic scenarios
        run: python src/check_cases.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build reproducible offline ZIP
        run: python src/package_release.py
      - name: Check archive uniqueness and integrity
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          path = Path('dist/base-usdc-payment-qa-kit-v0.1.0.zip')
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              assert z.testzip() is None
              assert len(names) == len(set(names)), 'duplicate ZIP member'
              assert len(names) >= 15
          print(f'validated archive: {len(names)} files, {path.stat().st_size} bytes')
      - name: Publish one prerelease on the preview commit (no main changes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='qa-fixture-kit-v0.1.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release found: $TAG; avoiding mutation."
            exit 0
          fi
          gh release create "$TAG" \
            'dist/base-usdc-payment-qa-kit-v0.1.0.zip#Free Offline QA Fixture Kit (35 scenarios)' \
            --target "$GITHUB_SHA" \
            --title 'Base USDC Payment QA Fixture Kit v0.1.0 (Synthetic Preview)' \
            --notes-file '.github/qa-preview-release-notes.md' \
            --prerelease \
            --latest=false
